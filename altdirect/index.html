<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        var destination = "https://altdirect.app/";
        var queryParams = window.location.search;
        var separator = queryParams ? "&" : "?";
        var redirectUrl = destination + queryParams + separator + "old=true";

        window.location.href = redirectUrl;
    </script>
</head>
<body>
    <p>Redirecting... <a id="fallback-link" href="https://altdirect.app/?old=true">Click here if not redirected.</a></p>
    <script>
        document.getElementById('fallback-link').href = redirectUrl;
    </script>
</body>
</html>
